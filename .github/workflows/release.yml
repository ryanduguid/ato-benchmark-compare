name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build, attest and publish
    outputs:
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Record provenance and SBOM attestations for release assets.
      contents: write # Create the draft release, upload assets and publish it.
      id-token: write # Obtain the OIDC identity required to sign attestations.
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the locked toolchain
        run: python -m pip install "uv==0.12.0"

      - name: Require a release-ready tag and repository
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$version" = "$(python -c 'import atobenchmark; print(atobenchmark.__version__)')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(sed -n '1p' RELEASE_NOTES.md)" = "# $GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Run the locked test suite
        run: uv run --locked --extra dev --python 3.12 pytest

      - name: Build wheel and source distribution
        run: uv run --locked --extra dev --python 3.12 python -m build

      - name: Generate SPDX SBOM for the wheel
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: dist/ato_benchmark_compare-${{ steps.release.outputs.version }}-py3-none-any.whl
          format: spdx-json
          syft-version: v1.51.0
          output-file: dist/ato_benchmark_compare-${{ steps.release.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Write and verify SHA-256 checksums
        run: |
          (cd dist && sha256sum *.whl *.tar.gz *.spdx.json > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Attest release asset provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.spdx.json
            dist/SHA256SUMS

      - name: Attest the wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ato_benchmark_compare-${{ steps.release.outputs.version }}-py3-none-any.whl
          sbom-path: dist/ato_benchmark_compare-${{ steps.release.outputs.version }}.spdx.json

      - name: Upload the attested distribution for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ steps.release.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  pypi:
    name: publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ato-benchmark-compare
    permissions:
      id-token: write # Obtain the OIDC identity that PyPI trusted publishing verifies.
    steps:
      - name: Download the exact distribution the release job attested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.release.outputs.version }}
          path: dist

      - name: Require exactly one wheel and one source distribution
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -name '*.whl' | wc -l)" = "1"
          test "$(find dist -name '*.tar.gz' | wc -l)" = "1"
          ls -l dist

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
