<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062C30"/>
      <stop offset="50%" stop-color="#053F44"/>
      <stop offset="100%" stop-color="#062C30"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#70E000"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/><line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/><line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/><line x1="800" y1="0" x2="800" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <rect x="80" y="80" width="1120" height="480" rx="20" fill="#053F44" fill-opacity="0.6" stroke="#00A896" stroke-width="2" filter="url(#shadow)"/>

  <rect x="120" y="125" width="280" height="36" rx="18" fill="#00F5D4" fill-opacity="0.15" stroke="#00F5D4" stroke-width="1.5"/>
  <text x="260" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00F5D4" text-anchor="middle" letter-spacing="1">ATO SMALL BUSINESS BENCHMARKS</text>

  <text x="120" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#tealGrad)">RaymondChambers</text>

  <text x="120" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Compare P&amp;L figures against ATO benchmark ranges on your local machine with working shown.
  </text>

  <g transform="translate(120, 325)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#062C30" stroke="#02C39A" stroke-width="1.2"/>
    <text x="100" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">100+ ATO Industries</text>

    <rect x="215" y="0" width="210" height="42" rx="10" fill="#062C30" stroke="#02C39A" stroke-width="1.2"/>
    <text x="320" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Precise Ratio Arithmetic</text>

    <rect x="440" y="0" width="200" height="42" rx="10" fill="#062C30" stroke="#02C39A" stroke-width="1.2"/>
    <text x="540" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Account Key Hash Check</text>

