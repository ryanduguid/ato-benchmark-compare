    <text x="20" y="55" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14" fill="#2DD4BF">$ ato-benchmark-compare map --profit-and-loss pnl.csv --out mapping.csv</text>
    <text x="20" y="80" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#94a3b8">Turnover: $520,000 | Industry: Bakery (Turnover $400k-$750k) | Ratio: Cost of Sales 48.2%</text>
    <text x="20" y="105" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" fill="#4ADE80">✓ Within ATO Benchmark Range (44% - 52%) • Full Working &amp; Deductions Trail Generated</text>
